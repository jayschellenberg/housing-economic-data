# TEMPORARY smoke test — delete once it has passed.
#
# refresh-data.yml needs SHARDS_TOKEN to push to jayschellenberg/housing-economic-shards,
# but its publish step short-circuits when the shards are unchanged, so a normal
# run does not exercise the token. That would leave the credential unproven until
# the first refresh that actually has shards to publish — i.e. it would fail at
# 03:00 a month from now, which is exactly the failure mode the publish step was
# written to avoid.
#
# This checks write access WITHOUT writing anything: `git push --dry-run` performs
# the full auth and ref negotiation and returns 403 on a read-only token, but
# changes nothing on the remote.
name: Verify SHARDS_TOKEN

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check write access to the shards repo
        env:
          SHARDS_TOKEN: ${{ secrets.SHARDS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SHARDS_TOKEN:-}" ]; then
            echo "::error::SHARDS_TOKEN is not set on this repository."
            exit 1
          fi
          git clone --quiet --depth 1 \
            https://github.com/jayschellenberg/housing-economic-shards.git /tmp/shards
          cd /tmp/shards
          echo "Cloned OK. Testing push access (dry run — nothing is written)…"
          if git push --dry-run \
               "https://x-access-token:${SHARDS_TOKEN}@github.com/jayschellenberg/housing-economic-shards.git" \
               HEAD:main 2>/tmp/err; then
            echo "PASS — SHARDS_TOKEN can push to housing-economic-shards."
          else
            echo "::error::SHARDS_TOKEN cannot push to housing-economic-shards. The token needs 'Contents: Read and write' on that repository."
            sed -e "s#${SHARDS_TOKEN}#***#g" /tmp/err || true
            exit 1
          fi
