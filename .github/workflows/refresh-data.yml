name: Refresh CMHC data
on:
  schedule:
    # Monthly heartbeat — 07:23 UTC on the 2nd of every month. Deliberately
    # off the top-of-the-hour cron slot, which GitHub heavily congests and
    # is the most common cause of silently-skipped scheduled runs.
    - cron: "23 7 2 * *"
    # CMHC release-day catch — Rms publishes the Fall report (October
    # survey) in late January and the Spring report (April survey) in
    # late July. These two crons fire after CMHC's typical publication
    # window so the site refreshes within hours of release.
    - cron: "23 7 28 1 *"
    - cron: "23 7 28 7 *"
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Bypass sanity-check shrink guard (use only when shrinkage is intentional)."
        required: false
        default: "0"
        type: choice
        options: ["0", "1"]

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # safety buffer under the 6-hour job ceiling
    permissions:
      contents: write
      issues: write        # for the failure-notification step
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: 98_sanity_check.R diffs the new manifest vs HEAD~, and
          # the commit step rebases the data commit if main advanced mid-run.
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          # Pinned (was "release") so an R minor bump can't silently change
          # behaviour — kept in sync with the package snapshot date below. This is
          # the version the last known-good refresh used. Bump both together.
          r-version: "4.6.1"
          # Pre-compiled Linux binaries (avoids source-compiling curl/httr/cmhc,
          # which fails on the runner for lack of system libs).
          use-public-rspm: true

      - name: Stamp run date
        id: stamp
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Install R packages
        run: |
          # Pin all CRAN packages to a Posit PPM dated snapshot for reproducible
          # refreshes, while keeping use-public-rspm's fast Linux binaries (the
          # dated snapshot serves binaries for the same distro + R version). Reuse
          # the repo PPM already configured and just freeze the date, so the distro
          # codename is never hard-coded. If the repo isn't the expected PPM shape,
          # fall back to unpinned so an install can never break. Bump SNAPSHOT with
          # the r-version above.
          SNAPSHOT <- "2026-09-01"
          repos <- getOption("repos")
          i <- grepl("packagemanager\\.posit\\.co/cran", repos)
          if (any(i)) {
            pinned <- sub("/(latest|[0-9]{4}-[0-9]{2}-[0-9]{2})/?$", paste0("/", SNAPSHOT), repos[i][[1]])
            # Keep ONLY the snapshot. Leaving the live CRAN mirror alongside it
            # defeats the pin: install.packages() takes the highest version across
            # all repos, so every package CRAN has moved ahead on is fetched from
            # CRAN instead — as *source*, since CRAN serves no Linux binaries.
            # That is how the 2026-09-02 refresh died: CRAN curl 8.0.0 outranked
            # the snapshot version, and compiling it needs libcurl headers the
            # runner lacks. One binary-serving repo = reproducible, no compiling.
            options(repos = c(RSPM = pinned))
          }
          cat("[install] repos:\n"); print(getOption("repos"))
          install.packages(c("cmhc", "cansim", "httr", "dplyr", "tidyr",
                             "purrr", "readr", "jsonlite", "readxl", "rvest"))
        shell: Rscript {0}

      - name: Run pipeline
        env:
          CMHC_ZONE_CMAS: ALL
          CMHC_ZONE_DWELLING: ALL
          CMHC_STARTS_ZONES: ALL
        run: |
          Rscript r/00_audit_geographies.R
          Rscript r/00_build_capabilities.R
          Rscript r/01_scrape_historical.R
          Rscript r/02_scrape_zone_snapshots.R
          Rscript r/05_scrape_starts.R
          Rscript r/06_scrape_secondary.R
          Rscript r/03_build_data_files.R
          node web/scripts/build-rental-summary.mjs   # rental_summary.json for the choropleth maps (reads r/03's shards)
          node web/scripts/build-starts-summary.mjs   # starts_summary.json for the Starts choropleth (reads r/03's starts shards)
          node web/scripts/build-schema.mjs           # schema.json category fingerprint for the sanity gate (r/98)
          Rscript r/04_build_manifest.R
          Rscript r/13_validate_indicators.R
          Rscript r/10_scrape_boc.R
          Rscript r/11_scrape_statscan.R
          Rscript r/14_build_indicators.R
          Rscript r/16_scrape_mls.R
          Rscript r/15_build_economic_update.R
          Rscript r/19_scrape_rtb.R
          Rscript r/25_scrape_court.R              # MB Court of King's Bench pre/post-judgment interest (Court tab)
          Rscript r/23_scrape_population_estimates.R   # annual CSD/province population estimates (Census Profile chart)
          # Agriculture-tab time-series (prices, input costs, farm cash, farm structure) refresh above via
          # r/11 + r/14 (catalog-driven). The within-province farm-structure MAP is 2021-Census-of-Agriculture
          # data — static until the next census (~2027) — so this best-effort step just re-confirms it and will
          # pick up the new census automatically; a transient census-table outage must not fail the refresh.
          Rscript r/24_build_farm_structure_map.R || echo "[refresh] r/24 farm-structure map skipped — keeping the committed 2021 data"

      - name: Verify samples against live API
        run: Rscript r/99_verify_samples.R

      - name: Sanity check (no silent shrink vs HEAD)
        env:
          REFRESH_ALLOW_SHRINK: ${{ inputs.allow_shrink || '0' }}
        run: Rscript r/98_sanity_check.R

      - name: Commit refreshed data if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          if git diff --staged --quiet; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: refresh (${{ steps.stamp.outputs.date }})"
            # This job can run for hours; main may have advanced (e.g. a merged
            # PR), which makes a plain push non-fast-forward. Rebase our single
            # data commit onto the latest main and retry a few times.
            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then pushed=true; break; fi
              echo "push rejected (attempt $attempt) — rebasing onto origin/main"
              git fetch origin main
              git rebase origin/main || { echo "rebase conflict — aborting"; git rebase --abort || true; exit 1; }
            done
            [ "$pushed" = true ] || { echo "push failed after retries"; exit 1; }
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Alert on a new MB RTB rent guideline
        if: success() && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # r/19 writes data/rtb_new_guideline.txt only when the scraped guideline
          # year/value differs from the previously committed file (gitignored, so
          # still present in the workspace). Raise one issue when that happens.
          if [ -f data/rtb_new_guideline.txt ]; then
            BODY="$(cat data/rtb_new_guideline.txt)"
            echo "RTB alert: $BODY"
            gh issue create \
              --title "New Manitoba RTB rent increase guideline" \
              --body "$BODY  —  detected by the monthly RTB scrape (r/19); the RTB (MB) tab and web/public/data/economy/rtb_mb.json are updated. Source: https://www.gov.mb.ca/cca/rtb/rentincreaseguideline/currentrentguideline.html" \
              || echo "gh issue create failed (continuing)"
          else
            echo "No new RTB guideline this run."
          fi

      - name: Alert on a new MB court interest rate
        if: success() && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # r/25 writes data/court_new_rate.txt only when the newest quarter or
          # its rate differs from the previously committed file (gitignored, so
          # still present in the workspace). Raise one issue when that happens.
          if [ -f data/court_new_rate.txt ]; then
            BODY="$(cat data/court_new_rate.txt)"
            echo "Court alert: $BODY"
            gh issue create               --title "New Manitoba court pre/post-judgment interest rate"               --body "$BODY  —  detected by the monthly court scrape (r/25); the Court tab and web/public/data/court/court_interest.json are updated. Source: https://www.manitobacourts.mb.ca/court-of-queens-bench/procedure-rules-and-forms/pre-judgment-and-post-judgment-interest/"               || echo "gh issue create failed (continuing)"
          else
            echo "No new court interest rate this run."
          fi

      - name: Notify by email — success with changes
        if: success() && steps.commit.outputs.changed == 'true'
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO:       ${{ vars.MAIL_TO }}
        # Step is skipped silently if the secrets aren't configured yet — the
        # subsequent SMTP action would otherwise hard-fail trying to auth
        # against an empty username. To enable: set the MAIL_USERNAME and
        # MAIL_PASSWORD repo secrets and the MAIL_TO repo variable (default
        # sender host is smtp.gmail.com:587 — override via SMTP_HOST/SMTP_PORT).
        run: |
          if [ -z "$MAIL_USERNAME" ] || [ -z "$MAIL_PASSWORD" ] || [ -z "$MAIL_TO" ]; then
            echo "Email secrets/vars not configured — skipping notification."
            echo "send=false" >> "$GITHUB_OUTPUT"
          else
            echo "send=true" >> "$GITHUB_OUTPUT"
          fi
        id: ok_email_gate
      - name: Send success email
        if: success() && steps.commit.outputs.changed == 'true' && steps.ok_email_gate.outputs.send == 'true'
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3.11.0
        # A notification is not the job. If SMTP auth breaks (an App Password
        # revoked, say), that must not turn a healthy data refresh red and
        # auto-open a "refresh failed" issue -- which is exactly what happened
        # on 2026-09-02 (issues #51, #52, both closed as false alarms). The
        # send failure still shows as a step annotation in the run log.
        continue-on-error: true
        with:
          server_address: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          server_port:    ${{ vars.SMTP_PORT || 587 }}
          # 465 = implicit TLS on connect; 587 (the default) = plaintext then
          # STARTTLS, which nodemailer does only when secure is false. Hard-coding
          # true against port 587 makes the connection hang rather than send.
          secure:         ${{ (vars.SMTP_PORT || '587') == '465' }}
          username:       ${{ secrets.MAIL_USERNAME }}
          password:       ${{ secrets.MAIL_PASSWORD }}
          from:           Housing & Economic Data <${{ secrets.MAIL_USERNAME }}>
          to:             ${{ vars.MAIL_TO }}
          subject:        "[Housing & Economic Data] Refresh OK — ${{ steps.stamp.outputs.date }}"
          body: |
            The scheduled CMHC-data refresh completed and pushed new data to main.

            Trigger:  ${{ github.event_name }}
            Run log:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Commit:   ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

            Vercel will redeploy automatically from main.

      - name: Notify by email — failure
        if: failure()
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO:       ${{ vars.MAIL_TO }}
        run: |
          if [ -z "$MAIL_USERNAME" ] || [ -z "$MAIL_PASSWORD" ] || [ -z "$MAIL_TO" ]; then
            echo "Email secrets/vars not configured — skipping notification."
            echo "send=false" >> "$GITHUB_OUTPUT"
          else
            echo "send=true" >> "$GITHUB_OUTPUT"
          fi
        id: fail_email_gate
      - name: Send failure email
        if: failure() && steps.fail_email_gate.outputs.send == 'true'
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3.11.0
        # A notification is not the job. If SMTP auth breaks (an App Password
        # revoked, say), that must not turn a healthy data refresh red and
        # auto-open a "refresh failed" issue -- which is exactly what happened
        # on 2026-09-02 (issues #51, #52, both closed as false alarms). The
        # send failure still shows as a step annotation in the run log.
        continue-on-error: true
        with:
          server_address: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          server_port:    ${{ vars.SMTP_PORT || 587 }}
          # 465 = implicit TLS on connect; 587 (the default) = plaintext then
          # STARTTLS, which nodemailer does only when secure is false. Hard-coding
          # true against port 587 makes the connection hang rather than send.
          secure:         ${{ (vars.SMTP_PORT || '587') == '465' }}
          username:       ${{ secrets.MAIL_USERNAME }}
          password:       ${{ secrets.MAIL_PASSWORD }}
          from:           Housing & Economic Data <${{ secrets.MAIL_USERNAME }}>
          to:             ${{ vars.MAIL_TO }}
          subject:        "[Housing & Economic Data] Refresh FAILED — ${{ steps.stamp.outputs.date }}"
          body: |
            The scheduled CMHC-data refresh FAILED.

            Trigger:  ${{ github.event_name }}
            Run log:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Commit:   ${{ github.sha }}

            A diagnostic GitHub issue will also be opened with a triage checklist.

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Refresh failed: ${{ steps.stamp.outputs.date }}" \
            --label "automation" \
            --body "$(cat <<'EOF'
          The scheduled \`Refresh CMHC data\` workflow failed.

          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Trigger: ${{ github.event_name }}
          - Commit: ${{ github.sha }}

          Investigate the run log; most common causes (in order of likelihood):

          1. **Sanity check tripped** — record counts shrank beyond tolerance.
             Inspect the \`Sanity check\` step output. If the shrink is
             intentional (e.g. a series was retired), re-run via
             workflow_dispatch with allow_shrink=1.
          2. **Verify samples mismatch** — a built shard disagreed with a
             fresh API call. Likely a partial CMHC API outage or a code bug
             in the shard builder. Re-running is safe.
          3. **CMHC / StatsCan / BoC outage** — scrape step exited; nothing
             was committed. Re-run later.
          4. **R package install failure** — transient CRAN issue. Re-run.
          5. **Job timed out** — full scrape exceeded the 330-min budget.
             Action required (incremental scrape).
          EOF
          )" || echo "issue create failed (likely a duplicate or token scope) — continuing"
