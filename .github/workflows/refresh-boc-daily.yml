name: Refresh BoC rates (daily)
on:
  schedule:
    # Tuesday–Saturday at 04:41 UTC (23:41 the evening before, Winnipeg), so
    # each run picks up the previous business day's GoC bond yields, policy
    # rate and broker variable rate. Monday is left to the weekly indicators
    # refresh, which pulls BoC as part of its full run.
    - cron: "41 4 * * 2-6"
  workflow_dispatch:

# Shares the weekly refresh's group: both rewrite web/public/data/indicators,
# so they must never run at the same time (see refresh-indicators.yml).
concurrency:
  group: refresh-indicators
  cancel-in-progress: false

jobs:
  refresh-boc:
    runs-on: ubuntu-24.04
    # A BoC-only build runs in a few minutes; anything near this is a hang.
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: r-lib/actions/setup-r@v2
        with:
          # Keep in step with refresh-indicators.yml (r-version + SNAPSHOT).
          r-version: "4.6.1"
          use-public-rspm: true

      - name: Stamp run date
        id: stamp
        run: |
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Install R packages
        run: |
          # Same PPM snapshot pin as refresh-indicators.yml -- the snapshot must
          # be the ONLY repo or the pin silently breaks. cmhc is needed because
          # r/lib/cmhc_helpers.R builds its CMAS table from it at load time.
          SNAPSHOT <- "2026-09-01"
          repos <- getOption("repos")
          i <- grepl("packagemanager\\.posit\\.co/cran", repos)
          if (any(i)) {
            pinned <- sub("/(latest|[0-9]{4}-[0-9]{2}-[0-9]{2})/?$", paste0("/", SNAPSHOT), repos[i][[1]])
            options(repos = c(RSPM = pinned))
          }
          cat("[install] repos:\n"); print(getOption("repos"))
          install.packages(c("cmhc", "httr", "dplyr", "tidyr", "purrr", "readr", "jsonlite"))
        shell: Rscript {0}

      - name: Run BoC pipeline
        # Only the BoC scrape is run. data/ is gitignored, so the StatsCan, OSB
        # and arrears CSVs are absent here; r/14 carries every series it can't
        # rebuild forward from the committed shards, so those charts are left
        # exactly as the weekly refresh last built them.
        shell: bash
        run: |
          {
            Rscript r/10_scrape_boc.R
            Rscript r/14_build_indicators.R
          } 2>&1 | tee "$RUNNER_TEMP/pipeline.log"

      - name: Sanity check (indicators shrink guard)
        run: Rscript r/98_sanity_check.R

      - name: Summarize refresh
        shell: bash
        run: |
          git show HEAD:web/public/data/indicators-manifest.json > "$RUNNER_TEMP/manifest.prev.json" || echo '{}' > "$RUNNER_TEMP/manifest.prev.json"
          python3 scripts/refresh_summary.py "$RUNNER_TEMP" "${{ steps.stamp.outputs.start }}"

      - name: Commit refreshed data if changed
        # Guarded to main, as in refresh-indicators.yml: a branch run is a test.
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          if git diff --staged --quiet; then
            echo "No BoC changes."
          else
            git commit -m "data: BoC daily refresh (${{ steps.stamp.outputs.date }})"
            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then pushed=true; break; fi
              echo "push rejected (attempt $attempt) — rebasing onto origin/main"
              git fetch origin main
              git rebase origin/main || { echo "rebase conflict — aborting"; git rebase --abort || true; exit 1; }
            done
            [ "$pushed" = true ] || { echo "push failed after retries"; exit 1; }
          fi

      # Failure-only notifications: a success email every weekday would bury
      # the weekly refresh's. A missed day is harmless -- the next run (or the
      # Monday weekly) catches up, since every run pulls full history.
      - name: Email gate — failure
        if: failure() || (cancelled() && github.event_name == 'schedule')
        id: fail_email_gate
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO:       ${{ vars.MAIL_TO }}
        run: |
          if [ -z "$MAIL_USERNAME" ] || [ -z "$MAIL_PASSWORD" ] || [ -z "$MAIL_TO" ]; then
            echo "Email secrets/vars not configured — skipping notification."
            echo "send=false" >> "$GITHUB_OUTPUT"
          else
            echo "send=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Send failure email
        if: (failure() || (cancelled() && github.event_name == 'schedule')) && steps.fail_email_gate.outputs.send == 'true'
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3.11.0
        continue-on-error: true
        with:
          server_address: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          server_port:    ${{ vars.SMTP_PORT || 587 }}
          secure:         ${{ (vars.SMTP_PORT || '587') == '465' }}
          username:       ${{ secrets.MAIL_USERNAME }}
          password:       ${{ secrets.MAIL_PASSWORD }}
          from:           Housing & Economic Data <${{ secrets.MAIL_USERNAME }}>
          to:             ${{ vars.MAIL_TO }}
          subject:        "[Housing & Economic Data] BoC daily refresh ${{ job.status == 'cancelled' && 'TIMED OUT' || 'FAILED' }} — ${{ steps.stamp.outputs.date }}"
          body: |
            The daily Bank of Canada rates refresh ${{ job.status == 'cancelled' && 'TIMED OUT' || 'FAILED' }}.

            Nothing was committed; the site still shows the previous BoC data.
            Usually a Valet API hiccup -- the next daily run or the Monday
            weekly refresh will catch up on its own. Re-run by hand if it repeats.

            Trigger:  ${{ github.event_name }}
            Run log:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
